name: CryptoBhai Auto Scanner

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Dependencies install
        run: pip install -q requests matplotlib

      - name: Bot cycle chalao
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python agent.py --run-once

      - name: State wapas save karo
        run: |
          git config user.name "cryptobhai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/signals.json data/state.json data/chats.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "bot state update [skip ci]"
            git push
          fi
